name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space & Remove Default NDKs
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            autoconf automake libtool pkg-config

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Assets
        run: |
          mkdir -p assets
          touch assets/.nomedia

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.36
          pip install https://github.com/kivy/buildozer/archive/master.zip

      - name: Setup SDK & NDK 25b
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          rm -rf ~/.buildozer/
          buildozer android debug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.1.8937393
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.1.8937393

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK
          path: bin/*.apk

      - name: Upload Logs on Fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ~/.buildozer/logs/

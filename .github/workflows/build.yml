name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libffi-dev libssl-dev ccache git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev

    - name: Install Python Packages
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Try Building APK with Requirements Combinations
      run: |
        # Matrix combinations to try sequentially
        COMBINATIONS=(
          "python3==3.11.5,hostpython3==3.11.5,pygame,pyjnius,android,requests"
          "python3==3.11.5,hostpython3==3.11.5,kivy,pyjnius,android,requests"
          "python3==3.11.5,hostpython3==3.11.5,kivy,pygame,pyjnius,android,requests"
        )

        SUCCESS=0

        for req in "${COMBINATIONS[@]}"; do
          echo "=================================================="
          echo "TRYING REQUIREMENTS: $req"
          echo "=================================================="
          
          # Update requirements line in buildozer.spec
          sed -i "s|^requirements =.*|requirements = $req|" buildozer.spec
          
          # Clean build folder before each attempt
          rm -rf .buildozer/
          
          # Attempt build
          if yes | buildozer android debug; then
            echo "BUILD SUCCESSFUL WITH: $req"
            SUCCESS=1
            break
          else
            echo "BUILD FAILED WITH: $req. TRYING NEXT COMBINATION..."
          fi
        done

        if [ $SUCCESS -ne 1 ]; then
          echo "ALL COMBINATIONS FAILED!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk

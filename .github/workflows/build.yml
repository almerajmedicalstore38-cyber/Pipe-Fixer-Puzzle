name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk + Remove Wrong NDKs
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27* /usr/local/lib/android/sdk/ndk/29* /usr/local/lib/android/sdk/ndk/28*
          df -h

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Assets
        run: |
          mkdir -p assets
          touch assets/.nomedia

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.36
          pip install https://github.com/kivy/buildozer/archive/master.zip

      - name: Setup SDK NDK 25b Only
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/licenses
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051b8ea11e4b" >> $ANDROID_HOME/licenses/android-sdk-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --uninstall "ndk;27.3.13750724" "ndk;29.0.14206865" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "build-tools;37.0.0" "platform-tools" "ndk;25.1.8937393"
          ls $ANDROID_HOME/ndk/

      - name: Build APK
        run: |
          rm -rf ~/.buildozer/
          buildozer android debug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.1.8937393

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK
          path: bin/*.apk

      - name: Upload Logs on Fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ~/.buildozer/logs/

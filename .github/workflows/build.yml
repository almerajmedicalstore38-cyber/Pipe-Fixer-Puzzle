name: Pipe Fixer P4A Final Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf automake libtool pkg-config zip unzip curl lld

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Manually
        run: |
          SDK_ROOT=$HOME/android-sdk
          rm -rf $SDK_ROOT
          mkdir -p $SDK_ROOT/cmdline-tools
          cd /tmp
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip -d $SDK_ROOT/cmdline-tools
          mv $SDK_ROOT/cmdline-tools/cmdline-tools $SDK_ROOT/cmdline-tools/latest
          export PATH=$SDK_ROOT/cmdline-tools/latest/bin:$PATH
          mkdir -p $SDK_ROOT/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea73128" >> $SDK_ROOT/licenses/android-sdk-license
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"
          ls $SDK_ROOT/platforms/
          echo "SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

      - name: Create Assets
        run: |
          mkdir -p assets
          touch assets/.nomedia

      - name: Install p4a & Cython
        run: |
          pip install --upgrade pip --no-input
          pip install Cython==0.29.36 --no-input
          pip install python-for-android --no-input

      - name: Build APK (Pure p4a)
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROIDSDK=$HOME/android-sdk
          export ANDROIDNDK=$HOME/android-sdk/ndk/25.1.8937393
          export ANDROIDAPI=33
          export ANDROIDMINAPI=21
          p4a apk \
          --private . \
          --package=com.sharafat.pipefixer \
          --name="Pipe Fixer" \
          --version=1.0 \
          --version-code=1 \
          --bootstrap=sdl2 \
          --requirements=python3,pygame,pyjnius,android \
          --arch=arm64-v8a \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --icon=icon.png \
          --hook p4a_hooks/ \
          --sdk-dir $HOME/android-sdk \
          --ndk-dir $HOME/android-sdk/ndk/25.1.8937393 \
          --android-api 33 \
          --copy-libs \
          --dist-name=pipefixer

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK
          path: "*.apk"

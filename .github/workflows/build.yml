name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev \
          python3-dev python3-pip python3-setuptools libltdl-dev libffi-dev \
          libssl-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev \
          libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev \
          liblzma-dev tk-dev libffi-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.36

    - name: Build APK with Buildozer
      run: |
        buildozer -s android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug.apk
        path: bin/*.apk

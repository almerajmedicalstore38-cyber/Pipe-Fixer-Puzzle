name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Assets
      run: |
        mkdir -p assets
        touch assets/.nomedia

    - name: Install Build Tools 37 Manually - MAIN FIX
      run: |
        sudo apt update
        sudo apt install -y wget unzip

        # Android SDK ka path banao
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools

        # Latest cmdline tools download karo
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip
        mv cmdline-tools latest

        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

        # Licenses folder banao
        mkdir -p $ANDROID_HOME/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c1051b8ea11e4b" >> $ANDROID_HOME/licenses/android-sdk-license

        # Sab licenses accept karo
        yes | sdkmanager --licenses

        # Build-Tools 37.0.0 + 33.0.2 dono install karo
        sdkmanager "build-tools;37.0.0" "build-tools;33.0.2" "platforms;android-33" "platforms;android-34" "platform-tools"

        # Buildozer ke liye link banao
        mkdir -p $HOME/.buildozer/android/platform/android-sdk
        cp -r $ANDROID_HOME/* $HOME/.buildozer/android/platform/android-sdk/ || true

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build Debug APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PipeFixer-Final-APK
        path: bin/*.apk

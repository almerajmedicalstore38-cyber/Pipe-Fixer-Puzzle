name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Assets
        run: |
          mkdir -p assets
          touch assets/.nomedia

      - name: Install Cython & Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.36
          pip install https://github.com/kivy/buildozer/archive/master.zip

      - name: Setup SDK NDK 25b with License Fix
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aidl || true
          mkdir -p /usr/local/lib/android/sdk/licenses
          mkdir -p /home/runner/.android
          touch /home/runner/.android/repositories.cfg
          # 4 licenses likhna zaroori hai 37.0.0 ke liye
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051b8ea11e4b" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "y" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > /usr/local/lib/android/sdk/licenses/android-sdk-arm-dbt-license || true
          # License accept
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Build-tools 33 aur 37 dono install
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "build-tools;37.0.0" "platform-tools" "ndk;25.1.8937393"
          # Aidl ka wrapper
          sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
          sudo bash -c 'echo "#!/bin/bash" > /usr/local/lib/android/sdk/tools/bin/sdkmanager'
          sudo bash -c 'echo "exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \$@" >> /usr/local/lib/android/sdk/tools/bin/sdkmanager'
          sudo chmod +x /usr/local/lib/android/sdk/tools/bin/sdkmanager
          ls -lh /usr/local/lib/android/sdk/build-tools/

      - name: Build APK
        run: |
          rm -rf /home/runner/.buildozer/
          mkdir -p /home/runner/.buildozer/android/platform/
          ln -sfn /usr/local/lib/android/sdk /home/runner/.buildozer/android/platform/android-sdk
          ln -sfn /usr/local/lib/android/sdk/ndk/25.1.8937393 /home/runner/.buildozer/android/platform/android-ndk-r25b
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK
          path: bin/*.apk

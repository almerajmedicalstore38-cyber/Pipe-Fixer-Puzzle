name: Build APK Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Assets
        run: |
          mkdir -p assets
          touch assets/.nomedia

      - name: Install Buildozer MASTER - BUG FIX
        run: |
          sudo apt update
          sudo apt install -y zip unzip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython==0.29.33

      - name: Fix sdkmanager Path - MAIN FIX
        run: |
          # Buildozer ko SDK ka structure banane do
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          
          # Agar cmdline-tools nahi hai to download karo
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          cp -r cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          cp -r cmdline-tools/lib ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          
          # Purane path ke liye symlink banao - Yahi bug fix hai
          cp ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
          
          # Licenses accept karo
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051b8ea11e4b" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK
          path: bin/*.apk

name: Pipe Fixer P4A Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libffi-dev libssl-dev ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            autoconf automake libtool pkg-config zip unzip curl lld

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Create Assets
        run: |
          mkdir -p assets
          touch assets/.nomedia

      - name: Install p4a & Cython
        run: |
          python -m pip install --upgrade pip wheel
          pip install Cython==0.29.36
          pip install python-for-android

      - name: Build APK (Pure p4a)
        run: |
          p4a apk \
          --private . \
          --package=com.sharafat.pipefixer \
          --name="Pipe Fixer" \
          --version=1.0 \
          --version-code=1 \
          --bootstrap=sdl2 \
          --requirements=python3,pygame,pyjnius,android \
          --arch=arm64-v8a \
          --arch=armeabi-v7a \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --icon=icon.png \
          --hook p4a_hooks/ \
          --copy-libs \
          --dist-name=pipefixer

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK
          path: |
            *.apk
            **/*.apk

      - name: Upload Logs on Fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p4a-logs
          path: |
            ~/.python-for-android/
            ./.p4a/

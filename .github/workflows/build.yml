name: Build APK Final

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Project
        run: |
          mkdir -p assets
          touch assets/.nomedia
          ls -la

      - name: Install Buildozer Master + PATCH SDK BUG
        run: |
          sudo apt update
          sudo apt install -y zip unzip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython==0.29.33
          
          # --- YEHI MAIN FIX HAI TUMHARE ERROR KA ---
          echo "Patching Buildozer..."
          BUILDOZER_FILE=$(python -c "import buildozer.scripts.client; import os; print(os.path.dirname(__file__))" 2>/dev/null || find /opt -name "android.py" | grep buildozer | head -1)
          # Buildozer ki android.py file me purana path replace karo
          find $HOME -name "android.py" 2>/dev/null | xargs sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' || true
          find /opt -name "android.py" 2>/dev/null | xargs sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' || true
          pip show buildozer | grep Location | cut -d' ' -f2 | xargs -I {} find {} -name "android.py" -exec sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' {} \; || true

          # SDK ko pehle se sahi jagah par install karo
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q -o tools.zip
          cp -r cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
          
          # Dono paths ke liye sdkmanager banao (purana aur naya)
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          cp ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          # License Accept
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051b8ea11e4b" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK-Final
          path: bin/*.apk

name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Assets Folder
      run: |
        mkdir -p assets
        touch assets/.nomedia

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev libbz2-dev
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33

    - name: Build APK
      run: |
        # Ye fix sdkmanager ka path theek karta hai
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        buildozer android debug --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PipeFixer-APK-32-64-Bit
        path: bin/*.apk
        if-no-files-found: error

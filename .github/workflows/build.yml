name: Build APK Final

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Project
        run: |
          mkdir -p assets
          touch assets/.nomedia

      - name: Fix SDK - Use System SDK
        run: |
          # 1. System SDK me purana wala path banao - Yahi error ka hal hai
          sudo mkdir -p $ANDROID_HOME/tools/bin
          echo '#!/bin/bash' | sudo tee $ANDROID_HOME/tools/bin/sdkmanager > /dev/null
          echo 'exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"' | sudo tee -a $ANDROID_HOME/tools/bin/sdkmanager > /dev/null
          sudo chmod +x $ANDROID_HOME/tools/bin/sdkmanager
          sudo chmod +x $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          
          # 2. Buildozer ke SDK folder ko System SDK se link karo
          mkdir -p ~/.buildozer/android/platform/
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          
          # 3. Licenses aur required packages install karo
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25b" || true
          
          # 4. Buildozer install
          pip install --upgrade pip
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython==0.29.33

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK-Final
          path: bin/*.apk

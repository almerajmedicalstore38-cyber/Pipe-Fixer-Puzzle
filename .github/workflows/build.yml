name: Build APK Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Create Assets Folder
        run: |
          mkdir -p assets
          touch assets/.nomedia
          echo "Assets fixed"

      - name: Build with Buildozer Action - AUTO FIX SDK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir:.
          buildozer_version: master
          command: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-Puzzle-APK
          path: bin/*.apk

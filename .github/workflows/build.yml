name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Assets
        run: |
          mkdir -p assets
          touch assets/.nomedia

      - name: Fix SDK and Install NDK 23b
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
          sudo bash -c 'echo "#!/bin/bash" > /usr/local/lib/android/sdk/tools/bin/sdkmanager'
          sudo bash -c 'echo "exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager $@" >> /usr/local/lib/android/sdk/tools/bin/sdkmanager'
          sudo chmod +x /usr/local/lib/android/sdk/tools/bin/sdkmanager
          sudo chmod +x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          mkdir -p /home/runner/.buildozer/android/platform
          rm -rf /home/runner/.buildozer/android/platform/android-sdk
          ln -s /usr/local/lib/android/sdk /home/runner/.buildozer/android/platform/android-sdk
          mkdir -p /home/runner/.android
          touch /home/runner/.android/repositories.cfg
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-32" "build-tools;32.0.0" "ndk;23.1.7779620" "platform-tools"
          pip install --upgrade pip
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython==0.29.33

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeFixer-APK
          path: bin/*.apk

name: Build Release APK - 32 & 64 Bit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 virtualenv

    - name: Build Release APK (32+64 Bit)
      run: |
        buildozer android release

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PipeFixer-Release-32-64-Bit
        path: bin/*release*.apk
        retention-days: 7

    - name: Upload Debug APK Also
      uses: actions/upload-artifact@v4
      with:
        name: PipeFixer-Debug-APK
        path: bin/*debug*.apk
        retention-days: 7
